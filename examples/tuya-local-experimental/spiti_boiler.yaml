input_number:
  spiti_boiler_short_minutes:
    name: Θερμοσίφωνας · Σύντομο
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_bath_minutes:
    name: Θερμοσίφωνας · Μπάνιο
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_cycle_minutes:
    name: Θερμοσίφωνας · Διάρκεια κύκλου
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_mon_minutes:
    name: Δευτέρα · Διάρκεια
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_tue_minutes:
    name: Τρίτη · Διάρκεια
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_wed_minutes:
    name: Τετάρτη · Διάρκεια
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_thu_minutes:
    name: Πέμπτη · Διάρκεια
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_fri_minutes:
    name: Παρασκευή · Διάρκεια
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_sat_minutes:
    name: Σάββατο · Διάρκεια
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
  spiti_boiler_sun_minutes:
    name: Κυριακή · Διάρκεια
    min: 5
    max: 40
    step: 1
    mode: box
    unit_of_measurement: min
input_text:
  spiti_boiler_program:
    name: Θερμοσίφωνας · Πρόγραμμα
    max: 40
  spiti_boiler_schedule_last:
    name: Θερμοσίφωνας · Τελευταία προγραμματισμένη εκτέλεση
    max: 40
script:
  spiti_boiler_start:
    alias: Σπίτι · Εκκίνηση θερμοσίφωνα
    mode: single
    fields:
      program:
        name: Πρόγραμμα
        required: true
        selector:
          select:
            options:
            - short
            - bath
            - scheduled
      scheduled_minutes:
        selector:
          number:
            min: 5
            max: 40
            step: 1
    sequence:
    - condition: template
      value_template: '{{ program in [''short'', ''bath'', ''scheduled''] and is_state(''switch.your_water_heater_local'',
        ''off'') }}'
    - condition: template
      value_template: '{{ states(''select.your_geyer_inching_local_test'') in [''5 min'', ''6 min'', ''7 min'',
        ''8 min'', ''9 min'', ''10 min'', ''11 min'', ''12 min'', ''13 min'', ''14 min'', ''15 min'', ''16 min'',
        ''17 min'', ''18 min'', ''19 min'', ''20 min'', ''21 min'', ''22 min'', ''23 min'', ''24 min'', ''25 min'',
        ''26 min'', ''27 min'', ''28 min'', ''29 min'', ''30 min'', ''31 min'', ''32 min'', ''33 min'', ''34 min'',
        ''35 min'', ''36 min'', ''37 min'', ''38 min'', ''39 min'', ''40 min''] }}'
    - wait_template: '{{ is_state(''script.spiti_boiler_restore_short'', ''off'') }}'
      timeout: 00:00:45
      continue_on_timeout: false
    - variables:
        minutes: '{{ scheduled_minutes|default(0)|float(0) if program == ''scheduled'' else states(''input_number.spiti_boiler_short_minutes''
          if program == ''short'' else ''input_number.spiti_boiler_bath_minutes'')|float(0) }}'
    - condition: template
      value_template: '{{ 5 <= minutes | float(0) <= 40 and is_number(states(''sensor.spiti_boiler_local_minutes''))
        }}'
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.spiti_boiler_cycle_valid
    - action: script.spiti_boiler_set_local_minutes
      data:
        minutes: '{{ minutes }}'
    - wait_template: '{{ is_number(states(''sensor.spiti_boiler_local_minutes'')) and states(''sensor.spiti_boiler_local_minutes'')
        | float(0) == minutes | float(0) }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - condition: template
      value_template: '{{ is_state(''switch.your_water_heater_local'', ''off'') }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.spiti_boiler_cycle_minutes
      data:
        value: '{{ minutes }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.spiti_boiler_program
      data:
        value: '{{ ''Σύντομο'' if program == ''short'' else ''Μπάνιο'' if program == ''bath'' else ''Εβδομαδιαίο''
          }}'
    - condition: template
      value_template: '{{ is_state(''select.your_geyer_inching_local_test'',(minutes|int|string) ~ '' min'') }}'
    - action: switch.turn_on
      target:
        entity_id: switch.your_water_heater_local
    - wait_template: '{{ is_state(''switch.your_water_heater_local'', ''on'') }}'
      timeout: 00:00:20
      continue_on_timeout: false
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.spiti_boiler_cycle_end
      data:
        timestamp: '{{ now().timestamp() + minutes | float(0) * 60 }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.spiti_boiler_cycle_valid
  spiti_boiler_stop:
    alias: Σπίτι · Διακοπή θερμοσίφωνα
    mode: restart
    sequence:
    - action: script.turn_off
      target:
        entity_id:
        - script.spiti_boiler_start
        - script.spiti_boiler_set_local_minutes
    - action: switch.turn_off
      target:
        entity_id: switch.your_water_heater_local
  spiti_boiler_restore_short:
    alias: Σπίτι · Επαναφορά σύντομου χρόνου
    mode: single
    sequence:
    - condition: template
      value_template: '{{ is_state(''switch.your_water_heater_local'', ''off'') and is_state(''script.spiti_boiler_start'',
        ''off'') and is_number(states(''input_number.spiti_boiler_short_minutes'')) and 5 <= states(''input_number.spiti_boiler_short_minutes'')
        | float(0) <= 40 and is_number(states(''sensor.spiti_boiler_local_minutes'')) and states(''sensor.spiti_boiler_local_minutes'')
        | float(0) != states(''input_number.spiti_boiler_short_minutes'') | float(0) }}'
    - action: script.spiti_boiler_set_local_minutes
      data:
        minutes: '{{ states(''input_number.spiti_boiler_short_minutes'') | int }}'
  spiti_boiler_set_local_minutes:
    alias: Σπίτι · Ρύθμιση τοπικού inching
    mode: single
    fields:
      minutes:
        required: true
        selector:
          number:
            min: 5
            max: 40
            step: 1
    sequence:
    - condition: template
      value_template: '{{ is_number(minutes) and 5 <= minutes|float <= 40 and minutes|float == minutes|int and is_state(''switch.your_water_heater_local'',''off'')
        }}'
    - condition: template
      value_template: '{{ states(''select.your_geyer_inching_local_test'') in [''5 min'', ''6 min'', ''7 min'',
        ''8 min'', ''9 min'', ''10 min'', ''11 min'', ''12 min'', ''13 min'', ''14 min'', ''15 min'', ''16 min'',
        ''17 min'', ''18 min'', ''19 min'', ''20 min'', ''21 min'', ''22 min'', ''23 min'', ''24 min'', ''25 min'',
        ''26 min'', ''27 min'', ''28 min'', ''29 min'', ''30 min'', ''31 min'', ''32 min'', ''33 min'', ''34 min'',
        ''35 min'', ''36 min'', ''37 min'', ''38 min'', ''39 min'', ''40 min''] }}'
    - variables:
        option: '{{ (minutes|int|string) ~ '' min'' }}'
    - action: select.select_option
      target:
        entity_id: select.your_geyer_inching_local_test
      data:
        option: '{{ option }}'
    - delay: 00:00:06
    - wait_template: '{{ is_state(''select.your_geyer_inching_local_test'',option) and is_state(''switch.your_water_heater_local'',''off'')
        }}'
      timeout: 00:00:20
      continue_on_timeout: false
automation:
- id: spiti_boiler_capture_external_start
  alias: Σπίτι · Εξωτερική εκκίνηση θερμοσίφωνα
  mode: single
  triggers:
  - trigger: state
    entity_id: switch.your_water_heater_local
    from: 'off'
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ not is_state(''script.spiti_boiler_start'', ''on'') }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.spiti_boiler_cycle_valid
  - action: input_text.set_value
    target:
      entity_id: input_text.spiti_boiler_program
    data:
      value: Χειροκίνητο
  - if:
    - condition: template
      value_template: '{{ is_number(states(''sensor.spiti_boiler_local_minutes'')) and 5 <= states(''sensor.spiti_boiler_local_minutes'')
        | float(0) <= 40 }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.spiti_boiler_cycle_minutes
      data:
        value: '{{ states(''sensor.spiti_boiler_local_minutes'') | float(0) }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.spiti_boiler_cycle_end
      data:
        timestamp: '{{ now().timestamp() + states(''sensor.spiti_boiler_local_minutes'') | float(0) * 60 }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.spiti_boiler_cycle_valid
- id: spiti_boiler_clear_estimate
  alias: Σπίτι · Τέλος εκτίμησης θερμοσίφωνα
  triggers:
  - trigger: state
    entity_id: switch.your_water_heater_local
    to: 'off'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.spiti_boiler_cycle_valid
  mode: restart
- id: spiti_boiler_restore_short_when_idle
  alias: Σπίτι · Σύντομος χρόνος για φυσικό διακόπτη
  mode: single
  triggers:
  - trigger: state
    entity_id: switch.your_water_heater_local
    to: 'off'
  - trigger: state
    entity_id: script.spiti_boiler_start
    to: 'off'
  - trigger: state
    entity_id:
    - input_number.spiti_boiler_short_minutes
    - sensor.spiti_boiler_local_minutes
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /1
  actions:
  - action: script.spiti_boiler_restore_short
- id: spiti_boiler_weekly_schedule
  alias: Σπίτι · Εβδομαδιαίο πρόγραμμα θερμοσίφωνα
  mode: single
  triggers:
  - trigger: time
    at: input_datetime.spiti_boiler_mon_time
    id: mon
  - trigger: time
    at: input_datetime.spiti_boiler_tue_time
    id: tue
  - trigger: time
    at: input_datetime.spiti_boiler_wed_time
    id: wed
  - trigger: time
    at: input_datetime.spiti_boiler_thu_time
    id: thu
  - trigger: time
    at: input_datetime.spiti_boiler_fri_time
    id: fri
  - trigger: time
    at: input_datetime.spiti_boiler_sat_time
    id: sat
  - trigger: time
    at: input_datetime.spiti_boiler_sun_time
    id: sun
  conditions:
  - condition: template
    value_template: '{{ trigger.id == [''mon'', ''tue'', ''wed'', ''thu'', ''fri'', ''sat'', ''sun''][now().weekday()]
      and is_state(''input_boolean.spiti_boiler_schedule_enabled'',''on'') and is_state(''input_boolean.spiti_boiler_''
      ~ trigger.id ~ ''_enabled'',''on'') and is_state(''switch.your_water_heater_local'',''off'') and is_state(''script.spiti_boiler_start'',''off'')
      and states(''input_text.spiti_boiler_schedule_last'') != now().strftime(''%Y-%m-%d'') }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.spiti_boiler_schedule_last
    data:
      value: '{{ now().strftime(''%Y-%m-%d'') }}'
  - action: script.spiti_boiler_start
    data:
      program: scheduled
      scheduled_minutes: '{{ states(''input_number.spiti_boiler_'' ~ trigger.id ~ ''_minutes'')|int(0) }}'
input_datetime:
  spiti_boiler_cycle_end:
    name: Θερμοσίφωνας · Εκτιμώμενη λήξη
    has_date: true
    has_time: true
  spiti_boiler_mon_time:
    name: Δευτέρα · Ώρα
    has_date: false
    has_time: true
  spiti_boiler_tue_time:
    name: Τρίτη · Ώρα
    has_date: false
    has_time: true
  spiti_boiler_wed_time:
    name: Τετάρτη · Ώρα
    has_date: false
    has_time: true
  spiti_boiler_thu_time:
    name: Πέμπτη · Ώρα
    has_date: false
    has_time: true
  spiti_boiler_fri_time:
    name: Παρασκευή · Ώρα
    has_date: false
    has_time: true
  spiti_boiler_sat_time:
    name: Σάββατο · Ώρα
    has_date: false
    has_time: true
  spiti_boiler_sun_time:
    name: Κυριακή · Ώρα
    has_date: false
    has_time: true
input_boolean:
  spiti_boiler_cycle_valid:
    name: Θερμοσίφωνας · Έγκυρη εκτίμηση κύκλου
    initial: false
  spiti_boiler_schedule_enabled:
    name: Θερμοσίφωνας · Εβδομαδιαίο πρόγραμμα
    icon: mdi:calendar-clock
  spiti_boiler_mon_enabled:
    name: Δευτέρα · Ενεργό
  spiti_boiler_tue_enabled:
    name: Τρίτη · Ενεργό
  spiti_boiler_wed_enabled:
    name: Τετάρτη · Ενεργό
  spiti_boiler_thu_enabled:
    name: Πέμπτη · Ενεργό
  spiti_boiler_fri_enabled:
    name: Παρασκευή · Ενεργό
  spiti_boiler_sat_enabled:
    name: Σάββατο · Ενεργό
  spiti_boiler_sun_enabled:
    name: Κυριακή · Ενεργό
template:
- triggers:
  - trigger: time_pattern
    seconds: /10
  - trigger: state
    entity_id:
    - switch.your_water_heater_local
    - input_boolean.spiti_boiler_cycle_valid
    - input_datetime.spiti_boiler_cycle_end
  sensor:
  - name: Spiti Boiler Remaining Estimated
    unique_id: spiti_boiler_remaining_estimated
    unit_of_measurement: min
    icon: mdi:timer-outline
    availability: '{{ is_state(''switch.your_water_heater_local'',''off'') or (is_state(''switch.your_water_heater_local'',''on'')
      and is_state(''input_boolean.spiti_boiler_cycle_valid'',''on'') and state_attr(''input_datetime.spiti_boiler_cycle_end'',''timestamp'')
      is number) }}'
    state: '{% if is_state(''switch.your_water_heater_local'',''on'') %}{{ ([(state_attr(''input_datetime.spiti_boiler_cycle_end'',''timestamp'')
      | float(0) - now().timestamp()) / 60, 0] | max) | round(2) }}{% else %}0{% endif %}'
- triggers:
  - trigger: state
    entity_id: select.your_geyer_inching_local_test
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ states(''select.your_geyer_inching_local_test'') in [''5 min'', ''6 min'', ''7 min'', ''8
      min'', ''9 min'', ''10 min'', ''11 min'', ''12 min'', ''13 min'', ''14 min'', ''15 min'', ''16 min'', ''17
      min'', ''18 min'', ''19 min'', ''20 min'', ''21 min'', ''22 min'', ''23 min'', ''24 min'', ''25 min'', ''26
      min'', ''27 min'', ''28 min'', ''29 min'', ''30 min'', ''31 min'', ''32 min'', ''33 min'', ''34 min'', ''35
      min'', ''36 min'', ''37 min'', ''38 min'', ''39 min'', ''40 min''] }}'
  sensor:
  - name: Spiti Boiler Local Minutes
    unique_id: spiti_boiler_local_minutes
    unit_of_measurement: min
    state: '{{ states(''select.your_geyer_inching_local_test'').split('' '')[0] | int }}'
- sensor:
  - name: Spiti Boiler Next Schedule
    unique_id: spiti_boiler_next_schedule
    icon: mdi:calendar-clock
    state: '{%- set keys = [''mon'',''tue'',''wed'',''thu'',''fri'',''sat'',''sun''] -%}

      {%- set ns = namespace(found=false, text=''Δεν έχει οριστεί ημέρα'') -%}

      {%- if not is_state(''input_boolean.spiti_boiler_schedule_enabled'',''on'') -%}Πρόγραμμα κλειστό

      {%- else -%}{%- for offset in range(8) -%}

      {%- set date = now() + timedelta(days=offset) -%}{%- set key = keys[date.weekday()] -%}

      {%- set clock = states(''input_datetime.spiti_boiler_'' ~ key ~ ''_time'') -%}

      {%- if not ns.found and is_state(''input_boolean.spiti_boiler_'' ~ key ~ ''_enabled'',''on'') and clock not
      in [''unknown'',''unavailable'',''''] -%}

      {%- set candidate = today_at(clock) + timedelta(days=offset) -%}

      {%- if candidate > now() and states(''input_text.spiti_boiler_schedule_last'') != candidate.strftime(''%Y-%m-%d'')
      -%}

      {%- set ns.found = true -%}{%- set ns.text = candidate.strftime(''%d/%m %H:%M'') ~ '' · '' ~ (states(''input_number.spiti_boiler_''
      ~ key ~ ''_minutes'')|int(0)|string) ~ '' λεπτά'' -%}

      {%- endif -%}{%- endif -%}{%- endfor -%}{{ ns.text }}{%- endif -%}'
homeassistant:
  customize:
    select.your_geyer_inching_local_test:
      friendly_name: Geyer Local · Χρόνος αυτόματου κλεισίματος
